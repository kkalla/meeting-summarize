# podman compose (또는 docker compose) 로 watcher 데몬을 띄운다.
#   podman compose up -d --build
# 사전 준비:
#   1) 호스트에서 setup.sh 로 모델(.bin)을 받아둔다(vendor/whisper.cpp/models/).
#   2) .env 에 OPENROUTER_API_KEY 를 채운다.
#   3) data/inbox 에 녹음파일을 떨구면 자동 처리되어 data/output 에 요약이 생긴다.
#
# 주의: 로컬 whisper.cpp 기반 legacy 파이프라인 전용이다. 현재 주력 사용법은 Slack 봇
# (scripts/run_slack_bot.py, Socket Mode, 컨테이너 불필요)이다. legacy/README.md 참고.
services:
  watcher:
    build:
      context: .
      dockerfile: Containerfile
    image: meeting-watcher
    restart: unless-stopped
    # OPENROUTER_API_KEY 등 시크릿을 환경변수로 주입(이미지에 굽지 않음).
    env_file:
      - .env
    volumes:
      # 입출력 폴더 — 호스트 data/ 를 컨테이너 /data 경로에 마운트.
      # 주의: pipeline.yaml 의 경로 기본값은 호스트 launchd 용 상대경로(data/)다. 컨테이너로
      # 돌리려면 watcher/cache 경로를 컨테이너 절대경로(/data/...)로 오버라이드해야 한다.
      - ./data/inbox:/data/inbox
      - ./data/processed:/data/processed
      - ./data/failed:/data/failed
      - ./data/output:/data/output
      # 전사 결과 캐시(issue #5). 후속 단계 실패 후 재처리 시 전사 스킵에 재사용.
      - ./data/transcripts:/data/transcripts
      # 모델(.bin)은 플랫폼 독립이라 호스트 빌드본을 컨테이너 빌드 경로에 그대로 마운트.
      - ./vendor/whisper.cpp/models/ggml-large-v3.bin:/app/vendor/whisper.cpp/models/ggml-large-v3.bin:ro
