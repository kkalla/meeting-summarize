[project]
name = "meeting-summarize"
version = "2.0.1"
description = "로컬 STT(whisper.cpp) + OpenRouter 무료티어로 회의 녹음을 구조화 요약하는 개인용 CLI 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
# black/flake8 과 동일하게 vendor(외부 클론)·빌드 산출물은 정렬 검사에서 제외한다.
# isort 는 .gitignore 를 자동으로 따르지 않으므로 명시한다.
extend_skip_glob = ["vendor/*", "build/*", "dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
