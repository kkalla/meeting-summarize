# 회의 요약 파이프라인 설정.
# 매직넘버/모델명/임계값은 전부 여기로 모읍니다. 코드에 하드코딩 금지.

audio:
  # ffmpeg 변환 대상 샘플레이트(Hz). whisper.cpp 권장값 16kHz mono.
  sample_rate: 16000
  # ffmpeg subprocess 타임아웃(초).
  timeout_sec: 300

stt:
  # whisper-cli 실행 파일. setup.sh 가 빌드하는 기본 경로(상대경로는 프로젝트 루트 기준).
  # PATH에 등록했다면 "whisper-cli" 로 바꿔도 됨.
  whisper_cli: "vendor/whisper.cpp/build/bin/whisper-cli"
  # large-v3 (full) 모델(ggml) 경로. turbo 대비 한국어 인식 정확도가 높다(디코더 32레이어).
  # 모델 받기: bash vendor/whisper.cpp/models/download-ggml-model.sh large-v3
  # 속도/용량 절충이 필요하면 ggml-large-v3-q5_0.bin (양자화) 도 가능.
  model_path: "vendor/whisper.cpp/models/ggml-large-v3.bin"
  # 전사 언어(ISO 639-1). 한국어로 명시하면 auto-detect 보다 정확도가 올라간다(한국어 회의 기준).
  language: "ko"
  # whisper-cli subprocess 타임아웃(초). 긴 회의 대비 넉넉하게.
  timeout_sec: 3600
  # 전사 예상시간 추정용 RTF(real-time factor): 예상 소요 = 오디오길이(초) × rtf_estimate.
  # 시작 로그에 "예상 ~N초" 를 찍는 휴리스틱이며 전사 자체에는 영향 없음.
  # 이 값은 첫 전사(콜드 스타트)용 초기값일 뿐이다 — 이후엔 실측 RTF 가 EMA 로 자동
  # 누적(data/transcripts/.rtf_state)되어 다음 전사 ETA 가 실제 하드웨어에 수렴한다.
  # large-v3 (full) 대략값: Metal 가속이면 ~0.6, 도커 CPU-only 면 ~2.8 (실측 2.82 기준).
  rtf_estimate: 0.6
  # whisper 초기 프롬프트(initial prompt): 자주 나오는 도메인 용어·고유명사를 미리 알려줘
  # 한국어 전문용어 오인식(예: "비식별화"→"비식별아", "다국어"→"다구건")을 줄인다.
  # 쉼표 나열형(아래 예시)이든 한 문장형이든 모두 동작하니 도메인이 바뀌면 용어만 갈아끼운다.
  # 앞뒤 공백은 자동 제거되고, 비우거나("") 공백만 있으면 --prompt 를 넘기지 않는다.
  # 주의: 길이 상한 2000자(초과 시 로딩 실패). 너무 길거나 무음이 많으면 프롬프트 단어가
  # 환각으로 새어 나올 수 있으니 핵심 용어 위주로 간결하게 유지한다.
  prompt: "이 회의는 AI OCR, 비식별화, 밸리데이트(validate), 액티브러닝, 비주얼 그라운딩, 분류기(classifier), 디지타이저, 로테이션 모델, 토큰 ID 예측, 하이브리드 모델, 다국어, 광주은행, 오토메이션 서브모듈, MVP 같은 머신러닝·제품 개발 용어를 다룬다."
  # 무음/환각 신뢰도 게이트.
  confidence_gate:
    # 세그먼트 no_speech_prob 가 이 값을 넘으면 무음으로 간주.
    max_no_speech_prob: 0.6
    # 세그먼트 평균 logprob 이 이 값보다 낮으면 환각 의심.
    min_avg_logprob: -1.0
    # 위 게이트를 통과(=유효 음성)한 세그먼트 비율이 이 값 미만이면 "유효 음성 없음" 판정.
    min_valid_ratio: 0.2
  # 전사 완전성 검사: 오디오 총 길이 - 마지막 세그먼트 end 가
  # 이 허용오차(초)를 초과하면 잘린 전사로 보고 실패.
  completeness_tolerance_sec: 5.0

chunking:
  # 청크 길이(분).
  minutes: 15
  # 청크 간 오버랩(초). 경계 액션아이템 누락 방지.
  overlap_sec: 30
  # 전사 전체 글자 수가 이 값 이하면 Map 생략하고 single-shot 요약.
  # (토큰이 아니라 문자 수 기준. 한국어 ~1.5자/토큰 가정 시 40000자 ≈ 2.7만 토큰 안팎.)
  # Map-Reduce 는 청크별 부분요약(간결화) → 통합(재압축)으로 정보를 두 번 깎아, 긴 회의가
  # 과도하게 짧게 요약되는 문제가 있다(예: 51분/33000자 회의 → 10줄). 따라서 폴백 체인 모델들의
  # 컨텍스트(120b 급은 수만 토큰)에 통째로 들어가는 길이는 single-shot 으로 raw 전사를 한 번에
  # 요약해 이중압축을 피한다. 이 값을 넘는 초장시간 회의만 Map-Reduce 로 분할한다.
  single_shot_max_chars: 40000

summarize:
  # OpenRouter 폴백 체인. 위에서부터 순서대로 시도.
  # 주의: 전부 :free 면 공용 쿼터라 상관 장애 위험(Ask First 대상).
  # 주의: 모든 모델에 reasoning 힌트(extra_body)가 전달된다. 비-reasoning 모델을 추가할 때
  #       해당 provider 가 unknown 파라미터를 거부(400)하면 멀쩡한 모델이 스킵될 수 있다.
  models:
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "google/gemma-4-31b-it:free"
    - "openai/gpt-oss-120b:free"
  base_url: "https://openrouter.ai/api/v1"
  # 모델당 429/타임아웃 재시도 횟수.
  max_retries: 4
  # 지수 백오프 기준(초). 대기 = backoff_base ** attempt.
  backoff_base: 2
  # 단일 LLM 요청 타임아웃(초).
  request_timeout_sec: 120
  # 생성 토큰 상한. reasoning 모델은 사고과정(<think>)도 이 예산을 쓰므로 넉넉히 둔다.
  # 너무 작으면 사고하다 본문이 잘려(finish_reason=length) 사고과정만 저장되는 사고가 난다.
  max_tokens: 16384
  temperature: 0.3
  # Map 단계 허용 누락률(%). 0 이면 청크 하나라도 실패 시 전체 실패.
  max_chunk_failure_pct: 0

cache:
  # 전사 결과 캐시. 전사 성공분을 원본 오디오 SHA-256 키로 보관해, 요약 등 후속
  # 단계 실패 후 재처리 시 전사(가장 비싼 단계)를 건너뛴다. (issue #5)
  # 경로는 프로젝트 루트 기준 상대경로(호스트 launchd 실행). RTF 자동보정 상태(.rtf_state)도 여기 둔다.
  transcripts_dir: "data/transcripts"
  # 이 시간이 지난 캐시는 watcher 스캔 시 삭제. 168h = 7일.
  ttl_hours: 168
  enabled: true

watcher:
  # 폴더 watcher 데몬 설정. 호스트에서 launchd(LaunchAgent)로 상시 실행.
  # 경로는 프로젝트 루트 기준 상대경로다(상대경로면 로더가 프로젝트 루트 기준으로 절대화). data/ 폴더를 그대로 쓴다.
  # 새 녹음파일이 inbox 에 올라오면 감지 -> 파이프라인 실행 -> processed/failed 로 이동.
  inbox_dir: "data/inbox"
  processed_dir: "data/processed"
  failed_dir: "data/failed"
  output_dir: "data/output"
  # 처리 완료/실패 시 macOS 시스템 알림(알림센터)을 띄운다. macOS 외(도커 리눅스 등)
  # 에서는 자동으로 무시되므로 true 여도 무해하다. 처음 한 번 알림 권한 승인이 필요할 수 있다.
  notify: true
  # 폴링 주기(초). 이 간격마다 inbox 를 스캔한다.
  poll_interval_sec: 10
  # 업로드 완료 판정: (size, mtime) 가 연속 이 횟수만큼 동일하면 "안정"으로 보고 처리.
  # 첫 관측은 스냅샷만 잡으므로, 안정 확정까지 최소 ((stability_checks - 1) * poll_interval_sec) 초 걸림
  # (기본 2회·10초면 약 10초).
  stability_checks: 2
  # 처리 대상 확장자(소문자, 점 포함). 그 외 파일은 무시.
  extensions:
    - ".m4a"
    - ".wav"
    - ".mp3"
    - ".mp4"
    - ".m4v"
    - ".qta"  # Apple 보이스메모/QuickTime 컨테이너(AAC). ffmpeg 가 내용 probe 로 디코딩.
